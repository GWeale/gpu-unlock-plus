name: Bug report
description: A build, packaging, CLI, benchmark validation, or boot-ordering problem. For a card that did not unlock, use an unlock failure report.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distribution
      placeholder: Ubuntu, Arch, Fedora; include the version
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel
      description: Output of `uname -r`
    validations:
      required: true

  - type: dropdown
    id: initramfs
    attributes:
      label: Initramfs generator
      options:
        - mkinitcpio
        - dracut
        - initramfs-tools
        - Not applicable (CLI or benchmark problem)
        - Other or not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Fork commit and install method
      description: Commit from `git rev-parse --short HEAD` in your checkout, and how you installed it.
      placeholder: 4189b17, make install-arch
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: The failing command's output, and relevant gpu_unlock kernel lines for boot problems. Redact credentials, UUIDs, hostnames, and unrelated host data before posting.
      render: text
    validations:
      required: false
