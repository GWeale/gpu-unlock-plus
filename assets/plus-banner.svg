<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">GPU Unlock Plus</title>
  <desc id="description">A Linux GPU unlock fork focused on RTX 20 and 30 series engine work, with source evidence and repeatable checks.</desc>
  <rect width="1280" height="320" rx="12" fill="#11191c"/>
